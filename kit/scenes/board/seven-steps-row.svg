<svg class="kit-scene" data-scene="seven-steps-row" role="img" aria-label="The seven steps in a row, with four back paths: A from step 2 to step 1, B from step 5 to step 4, C from step 6 to step 3 or stop, D from step 7 back to itself after a repair" viewBox="0 0 1240 296" font-family="Source Serif 4"><circle cx="70" cy="135" r="24" fill="#3a2e26"/><text data-l="1" x="70" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">1</text><text data-l="2" x="70" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">What the device</text><text data-l="3" x="70" y="202" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">must do</text><path d="M98 135H223" stroke="#3a2e26" stroke-width="2"/><path d="M217 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="253" cy="135" r="24" fill="#3a2e26"/><text data-l="4" x="253" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">2</text><text data-l="5" x="253" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">The whole budget</text><path d="M281 135H406" stroke="#3a2e26" stroke-width="2"/><path d="M400 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="436" cy="135" r="24" fill="#3a2e26"/><text data-l="6" x="436" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">3</text><text data-l="7" x="436" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">What the model</text><text data-l="8" x="436" y="202" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">does</text><path d="M464 135H589" stroke="#3a2e26" stroke-width="2"/><path d="M583 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="619" cy="135" r="24" fill="#3a2e26"/><text data-l="9" x="619" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">4</text><text data-l="10" x="619" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">Where each part</text><text data-l="11" x="619" y="202" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">runs</text><path d="M647 135H772" stroke="#3a2e26" stroke-width="2"/><path d="M766 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="802" cy="135" r="24" fill="#3a2e26"/><text data-l="12" x="802" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">5</text><text data-l="13" x="802" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">Design the analog</text><text data-l="14" x="802" y="202" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">part</text><path d="M830 135H955" stroke="#3a2e26" stroke-width="2"/><path d="M949 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="985" cy="135" r="24" fill="#3a2e26"/><text data-l="15" x="985" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">6</text><text data-l="16" x="985" y="183" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="15" fill="#2b2622">The full cost</text><path d="M1013 135H1138" stroke="#3a2e26" stroke-width="2"/><path d="M1132 130l6 5-6 5" stroke="#3a2e26" stroke-width="2" fill="none"/><circle cx="1168" cy="135" r="24" fill="#3a2e26"/><text data-l="17" x="1168" y="141" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="600" font-size="17" fill="#f3ede2">7</text><text data-l="18" x="1168" y="183" text-anchor="middle" font-family="Fraunces" font-weigh