<svg class="kit-scene" data-scene="reference-flow-seven-stops" viewBox="0 0 1296 640" role="img" aria-label="A reference flow in seven stops. Software prepares: a signal becomes an opportunity, then prepared work; nothing is sent. An authorised person approves one exact version. The system that owns the record acts within that approval; in the sample that is Finance. Read back the real record; an unknown result is looked up, never resent blind. Learn: what happened changes the next signal. Handovers today: signal to opportunity proposed; opportunity to prepared work a stored copy; the next three in the code; read back to learn proposed. Arrows say what passes: a dated sourced finding, a question worth checking, a review packet, an approval for one exact version, the system’s record of what it did, the confirmed result."><path d="M10.0 50 V62 H545.4 V50 M277.7 62 v9" fill="none" stroke="#2B2622" stroke-width="1.6" stroke-linejoin="round"/><text data-l="1" x="277.7" y="36.0" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" fill="#2B2622" font-weight="600" letter-spacing="1.4">SOFTWARE PREPARES</text><path d="M565.4 50 V62 H730.6 V50 M648.0 62 v9" fill="none" stroke="#9A4A22" stroke-width="1.6" stroke-linejoin="round"/><text data-l="2" x="648.0" y="36.0" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" fill="#9A4A22" font-weight="600" letter-spacing="1.4">PEOPLE APPROVE</text><path d="M750.6 50 V62 H1100.9 V50 M925.7 62 v9" fill="none" stroke="#2B2622" stroke-width="1.6" stroke-linejoin="round"/><text data-l="3" x="925.7" y="36.0" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" fill="#2B2622" font-weight="600" letter-spacing="1.4">THE AUTHORISED SYSTEM ACTS, READS BACK</text><path d="M1120.9 50 V62 H1286.0 V50 M1203.4 62 v9" fill="none" stroke="#2B2622" stroke-width="1.6" stroke-linejoin="round"/><text data-l="4" x="1203.4" y="36.0" text-anchor="middle" font-