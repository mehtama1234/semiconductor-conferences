<svg class="kit-scene" data-scene="camera-on-cable" viewBox="0 0 560 350" role="img" aria-label="A dome camera on one cable from a PoE switch. The cable gives 12.95 W at the camera. The plan fills it: the camera up to 8.9 W, a companion chip&#x27;s support parts, supply losses and 1.5 W for AI. A second model needing about 1 W does not fit."><defs><pattern id="camera-on-cable-camh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#3a2e26"/><rect width="5" height="10" fill="#5a5047"/></pattern><pattern id="camera-on-cable-camf" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fbf7f0"/><rect width="5" height="10" fill="#e3b98f"/></pattern></defs><rect x="0" y="0" width="560" height="14" fill="#d9cdba"/><path d="M150 22H490V70" fill="none" stroke="#3a2e26" stroke-width="7"/><g transform="translate(40 14)"><rect x="0" y="0" width="150.0" height="20.0" rx="5.0" fill="#3a2e26"/><path d="M10.0 20.0h130.0a65.0 65.0 0 0 1 -130.0 0z" fill="#5a5047"/><path d="M10.0 20.0h130.0a65.0 65.0 0 0 1 -130.0 0z" fill="none" stroke="#3a2e26" stroke-width="3.8"/><circle cx="75.0" cy="50.0" r="26.2" fill="#3a2e26"/><circle cx="75.0" cy="50.0" r="12.5" fill="#e3b98f"/><circle cx="68.8" cy="43.8" r="3.8" fill="#fff"/></g><path d="M92 92L20 190M138 92l72 98" stroke="#e3b98f" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="440" y="70" width="100" height="58" rx="6" fill="#5a5047"/><rect x="450" y="94" width="14" height="12" rx="2" fill="#e3b98f"/><rect x="471" y="94" width="14" height="12" rx="2" fill="#fbf7f0"/><rect x="492" y="94" width="14" height="12" rx="2" fill="#fbf7f0"/><rect x="513" y="94" width="14" height="12" rx="2" fill="#fbf7f0"/><text data-l="1" x="490" y="150" text-anchor="middle" font-family="IBM Plex Sans Condensed,sans-serif" font-size="16" fill="#2b2622">PoE switch</text><text data-l="2" x="320" y="48" text-anchor="middle" font-famil