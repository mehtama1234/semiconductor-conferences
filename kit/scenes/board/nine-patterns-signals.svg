sed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">Fleet data compounds</text><text data-l="17" x="40" y="215" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">for whoever runs the</text><text data-l="18" x="40" y="228" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">fleet</text><rect x="24" y="240" width="10" height="8" fill="#3a2e26"/><rect x="38" y="240" width="10" height="8" fill="#3a2e26"/><rect x="184" y="180" width="160" height="74" fill="#fbf7f0" stroke="#d9cdba"/><rect x="184" y="180" width="160" height="4" fill="#9a4a22"/><text data-l="19" x="192" y="202" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="600" fill="#9a4a22" text-anchor="start">6</text><text data-l="20" x="208" y="202" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">Safety rules move from</text><text data-l="21" x="208" y="215" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">the robot to the whole</text><text data-l="22" x="208" y="228" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">application</text><rect x="192" y="240" width="10" height="8" fill="#3a2e26"/><rect x="206" y="240" width="10" height="8" fill="#3a2e26"/><rect x="16" y="264" width="160" height="74" fill="#fbf7f0" stroke="#d9cdba"/><rect x="16" y="264" width="160" height="4" fill="#9a4a22"/><text data-l="23" x="24" y="286" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="600" fill="#9a4a22" text-anchor="start">7</text><text data-l="24" x="40" y="286" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">Labour shortage</text><text data-l="25" x="40" y="299" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">pushes; labour</text><text data-l="26" x="40" y="312" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">agreements can block</text><rect x="24" y="324" width="10" height="8" fill="#3a2e26"/><rect x="38" y="324" width="10" height="8" fill="#3a2e26"/><rect x="184" y="264" width="160" height="74" fill="#fbf7f0" stroke="#d9cdba"/><rect x="184" y="264" width="160" height="4" fill="#9a4a22"/><text data-l="27" x="192" y="286" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="600" fill="#9a4a22" text-anchor="start">8</text><text data-l="28" x="208" y="286" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">Supply and trade can</text><text data-l="29" x="208" y="299" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">stall a programme</text><text data-l="30" x="208" y="312" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">whatever the</text><rect x="192" y="324" width="10" height="8" fill="#3a2e26"/><rect x="206" y="324" width="10" height="8" fill="#3a2e26"/><rect x="16" y="348" width="160" height="74" fill="#fbf7f0" stroke="#d9cdba"/><rect x="16" y="348" width="160" height="4" fill="#9a4a22"/><text data-l="31" x="24" y="370" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="600" fill="#9a4a22" text-anchor="start">9</text><text data-l="32" x="40" y="370" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">Company figures run</text><text data-l="33" x="40" y="383" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">ahead of independent</text><text data-l="34" x="40" y="396" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="600" fill="#3a2e26" text-anchor="start">ones</text><rect x="24" y="408" width="10" height="8" fill="#3a2e26"/><rect x="38" y="408" width="10" height="8" fill="none" stroke="#3a2e26"/></svg>
