<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Slides · Semiconductor conference atlas</title><meta property="og:type" content="website"><meta property="og:site_name" content="Semiconductor conference atlas"><meta property="og:title" content="Slides · Semiconductor conference atlas"><meta property="og:description" content="Semiconductor conference atlas: 582 papers from ISCA, DAC and ICCAD, sorted into 10 themes and six directions to watch."><meta property="og:url" content="https://mehtama1234.github.io/semiconductor-conferences/presentation/present.html"><meta property="og:image" content="https://mehtama1234.github.io/semiconductor-conferences/presentation/slides/01-cover.jpg"><meta property="og:image:width" content="1920"><meta property="og:image:height" content="1080"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="Semiconductor conference atlas: 582 papers from ISCA, DAC and ICCAD, sorted into 10 themes and six directions to watch."><link rel="icon" href="../assets/icon.svg" type="image/svg+xml"><style>
:root{--bg:#1F1915;--ink:#F3ECE1;--muted:#CDBFA9;--rust:#E3B98F;--bar:rgba(31,25,21,.92)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
.stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;padding:12px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 8px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
body.full .stage{inset:0;padding:0}body.full .stage img{box-shadow:none}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--bar);display:flex;align-items:center;gap:8px;padding:0 12px;transition:opacity .25s}
body.full .bar{opacity:0}body.full.show-bar .bar{opacity:1}
.bar button,.bar a{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #5A4A3E;background:transparent;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.bar button:hover,.bar a:hover{border-color:var(--rust)}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.count{min-width:72px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.notes{position:fixed;left:0;right:0;bottom:56px;max-height:34vh;overflow:auto;background:#2B231D;border-top:2px solid var(--rust);padding:14px 20px;font:400 18px/1.5 Georgia,serif;display:none}
body.notes-on .notes{display:block}body.notes-on .stage{bottom:calc(56px + 34vh)}
body.full .notes{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{color:var(--muted);font-size:13px}
.bar button,.bar a{white-space:nowrap}.short{display:none}
.bar a .label{display:inline}
@media (max-width:640px){.hint,.label,.bar a .label,#notes-toggle{display:none}.short{display:inline}.count{min-width:52px}.bar button,.bar a{padding:0 8px}.bar{gap:4px}.bar{gap:6px;padding:0 8px}.bar button,.bar a{padding:0 10px}}
</style></head><body>
<main class="stage" aria-label="Slides"><img id="view" src="slides/01-cover.jpg" alt="What do this year’s chip-design conferences say about where the field is going?"></main>

<p class="sr" id="live" aria-live="polite"></p>
<nav class="bar" aria-label="Slide controls">
<a href="./" title="All slides"><span class="label">← All slides</span><span class="short">All</span></a>
<button type="button" id="prev" aria-label="Previous slide">←</button><span class="count" id="count">1 / 12</span><button type="button" id="next" aria-label="Next slide">→</button>
<span class="spacer"></span><span class="hint">Arrow keys or tap to move · F for full screen · N for presenter view</span>
<button type="button" id="notes-toggle" title="Presenter view with notes, next slide and a timer, in a separate window (N)">Presenter view</button><a href="semiconductor-atlas-slides.pdf" download title="Download PDF"><span class="label">PDF</span><span class="sr"> download</span>⤓</a>
<button type="button" id="full" title="Full screen (F)" aria-label="Full screen"><span class="label" id="full-label">Full screen</span><span class="short" id="full-short" aria-hidden="true">⛶</span></button>
</nav>
<script>var ITEMS=[{"src": "slides/01-cover.jpg", "alt": "What do this year\u2019s chip-design conferences say about where the field is going?", "notes": "This is an atlas of 582 papers from three chip-design conferences: ISCA, DAC and ICCAD. It asks one question. What do these papers, taken together, say about where chip and computer design is going?"}, {"src": "slides/02-three.jpg", "alt": "The whole story in three sentences.", "notes": "Here is the whole story in three sentences. One: chip design is becoming a loop. Propose, check, learn, try again. Two: accelerators, memory and reliability draw the most papers. Three: most papers were read from short descriptions, so these are hypotheses, not proven trends."}, {"src": "slides/03-path.jpg", "alt": "The atlas in five steps: papers, themes, subthemes, deep reads, what to watch.", "notes": "The atlas works in five steps. Start with 582 paper records. Sort them into 10 broad themes, then 113 narrower subthemes, each explained in plain words. Read some papers in full. Then ask which directions keep coming back, and what test would confirm them."}, {"src": "slides/04-confs.jpg", "alt": "DAC supplies 544 of the 582 papers.", "notes": "First, where the papers come from. DAC, the Design Automation Conference, supplies 544 of the 582. ISCA, the main computer architecture conference, adds 17 selected papers. ICCAD's 2026 papers were not public yet, so 21 come from 2025. So the atlas leans toward design software."}, {"src": "slides/05-themes.jpg", "alt": "Accelerators, memory and reliability are the three largest of 10 themes.", "notes": "Here is where the attention goes. Architecture and accelerators is the largest theme, with 103 papers. Memory, interconnect, and storage has 85. Power, reliability, and security has 78. A count shows where this sample spends its attention. It is not a ranking of importance."}, {"src": "slides/06-loop.jpg", "alt": "Direction: design becomes a loop that checks every candidate and learns from what failed.", "notes": "The common thread is a loop. A model or a search proposes a design. Tools check it: does it compile, does it simulate correctly, does it meet timing? The check reports what failed, and the next attempt uses that. The hard question is cost: a fair test counts every model call, retry and check."}, {"src": "slides/07-data.jpg", "alt": "Direction: moving data often costs more than computing it.", "notes": "The second direction is about data. A chip can have thousands of arithmetic units, but they wait if their inputs cannot arrive in time. So many papers decide where data sits, how far it moves, and whether to compute next to memory. The test is the end-to-end result, with every copy and wait counted."}, {"src": "slides/08-physical.jpg", "alt": "Directions: physical limits and faults enter the design early.", "notes": "Two more directions move physics and safety earlier. Heat, wire delay and power supply used to be checked at the end. Now fast estimates guide early choices, but the final design still needs an accurate check. Likewise, faults and attacks are named first, and the cost of protection is reported, not hidden."}, {"src": "slides/09-measure.jpg", "alt": "Direction: how results are measured is becoming research in its own right.", "notes": "The last direction is about measurement itself. A score means little without the tasks it was tested on, the rule for success, and the baseline. More papers now build benchmarks and release their tools. The test for this direction is simple: can someone else repeat the result and get the same answer?"}, {"src": "slides/10-depth.jpg", "alt": "Only 33 of 582 papers were read from a full paper or preprint.", "notes": "Now, how sure can we be? 541 of the 582 records were coded from the short official program description. Only 33 come from a full paper, preprint or author PDF. 16 papers were checked in depth. So every direction here is a hypothesis to test, not a proven trend."}, {"src": "slides/11-watch.jpg", "alt": "Six directions to watch, each with a test that could disprove it.", "notes": "Here are the six directions to watch. Requirements checked while designing. Data movement as the real cost. Measure, then decide the next design. Faults and attacks planned early. Physical limits in the loop. And better ways to measure. Each page names the paper that pushes back, and the result that would disprove it."}, {"src": "slides/12-start.jpg", "alt": "Where to start: themes, subthemes, deep reads and the six directions.", "notes": "To explore it yourself, start with a theme. Each one explains the technical problem in plain words, then links to its subthemes and every paper in them. Check the deep reads for papers read in full. Then open the six directions. Everything is linked from the big picture page."}];var KIND="Slide";
(function(){
  var items = ITEMS, i = 0, kind = KIND;
  var img = document.getElementById('view'), count = document.getElementById('count'), live = document.getElementById('live'), notes = document.getElementById('notes');
  var m = /[#&]?(\d+)$/.exec(location.hash); if (m) i = Math.min(items.length - 1, Math.max(0, +m[1] - 1));
  // Load the neighbours early so moving between pages is instant.
  items.forEach(function(item){ var pre = new Image(); pre.src = item.src; });
  // The presenter window and this one stay on the same slide.
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel('course-present') : null, quiet = false;
  if (channel) channel.onmessage = function(e){ if (e.data && typeof e.data.slide === 'number' && e.data.slide !== i) { quiet = true; show(e.data.slide); quiet = false; } if (e.data && e.data.hello) channel.postMessage({slide: i}); };
  function show(n){
    i = Math.min(items.length - 1, Math.max(0, n));
    img.src = items[i].src; img.alt = items[i].alt;
    count.textContent = (i + 1) + ' / ' + items.length;
    live.textContent = kind + ' ' + (i + 1) + ' of ' + items.length + '. ' + items[i].alt;
    history.replaceState(null, '', '#' + (i + 1));
    if (channel && !quiet) channel.postMessage({slide: i});
    document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === items.length - 1;
  }
  function full(){
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  }
  document.addEventListener('fullscreenchange', function(){ document.body.classList.toggle('full', !!document.fullscreenElement); var on = !!document.fullscreenElement; document.getElementById('full-label').textContent = on ? 'Exit full screen' : 'Full screen'; document.getElementById('full-short').textContent = on ? '✕' : '⛶'; document.getElementById('full').setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); });
  document.getElementById('prev').onclick = function(){ show(i - 1); };
  document.getElementById('next').onclick = function(){ show(i + 1); };
  document.getElementById('full').onclick = full;
  // Speaker notes open in their own window, for the laptop screen, so they never show on the projector.
  var notesBtn = document.getElementById('notes-toggle');
  if (notesBtn) notesBtn.onclick = function(){ window.open('presenter.html#' + (i + 1), 'course-presenter', 'width=1280,height=800'); };
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    // Space and Enter on a focused button press that button; they never also move the slides.
    if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button, a')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(items.length - 1); }
    else if (k === 'f' || k === 'F') { full(); }
    else if ((k === 'n' || k === 'N') && notesBtn) { notesBtn.click(); }
  });
  // Click the right two thirds to go forward, the left third to go back. Swipe on phones.
  document.querySelector('.stage').addEventListener('click', function(e){ if (e.clientX < innerWidth / 3) show(i - 1); else show(i + 1); });
  var x0 = null; document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive: true});
  document.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  // In full screen the bar hides; moving the mouse brings it back for a moment.
  var t = null; document.addEventListener('mousemove', function(){ document.body.classList.add('show-bar'); clearTimeout(t); t = setTimeout(function(){ document.body.classList.remove('show-bar'); }, 1800); });
  window.addEventListener('hashchange', function(){ var h = /#([0-9]+)$/.exec(location.hash); if (h && +h[1] - 1 !== i) show(+h[1] - 1); });
  show(i);
})();
</script>
</body></html>
