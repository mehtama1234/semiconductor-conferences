<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Presenter view · Semiconductor conference atlas</title><meta property="og:type" content="website"><meta property="og:site_name" content="Semiconductor conference atlas"><meta property="og:title" content="Presenter view · Semiconductor conference atlas"><meta property="og:description" content="Semiconductor conference atlas: 582 papers from ISCA, DAC and ICCAD, sorted into 10 themes and six directions to watch."><meta property="og:url" content="https://mehtama1234.github.io/semiconductor-conferences/presentation/presenter.html"><meta property="og:image" content="https://mehtama1234.github.io/semiconductor-conferences/presentation/slides/01-cover.jpg"><meta property="og:image:width" content="1920"><meta property="og:image:height" content="1080"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="Semiconductor conference atlas: 582 papers from ISCA, DAC and ICCAD, sorted into 10 themes and six directions to watch."><link rel="icon" href="../assets/icon.svg" type="image/svg+xml"><style>
:root{--bg:#1F1915;--ink:#F3ECE1;--muted:#CDBFA9;--rust:#E3B98F;--panel:#2B231D}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}
.grid{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:auto 1fr auto;gap:14px;height:100%;padding:14px}
.now{grid-row:1/3;display:flex;flex-direction:column;gap:8px;min-height:0}.now img{width:100%;height:auto;max-height:62vh;object-fit:contain;background:#000}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}.side img{width:100%;height:auto;opacity:.85;background:#000}
.label{font:600 12px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.notes{grid-column:2;grid-row:2;background:var(--panel);border-left:3px solid var(--rust);padding:14px 16px;overflow:auto;font:400 20px/1.5 Georgia,serif}
.controls{grid-column:1/3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #5A4A3E;background:transparent;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--rust)}:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.clock{font:600 28px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;margin-left:auto}.count{color:var(--muted);min-width:70px;text-align:center}
.end{color:var(--muted);padding:30px 0;text-align:center}
</style></head><body>
<main class="grid" aria-label="Presenter view">
<section class="now"><span class="label">Now showing</span><img id="now" src="slides/01-cover.jpg" alt=""></section>
<section class="side"><span class="label">Up next</span><img id="next-img" src="" alt=""><p class="end" id="end" hidden>Last slide. Take questions.</p></section>
<section class="notes" aria-label="Speaker notes"><span class="label" style="display:block;margin-bottom:8px">Your notes (only on this screen)</span><div id="notes"></div></section>
<nav class="controls" aria-label="Slide controls"><button type="button" id="prev" aria-label="Previous slide">←</button><span class="count" id="count">1 / 12</span><button type="button" id="next" aria-label="Next slide">→</button><button type="button" id="timer">Start timer</button><span class="clock" id="clock" role="timer" aria-label="Time since you started">00:00</span></nav>
</main>
<script>var ITEMS=[{"src": "slides/01-cover.jpg", "alt": "What do this year\u2019s chip-design conferences say about where the field is going?", "notes": "This is an atlas of 582 papers from three chip-design conferences: ISCA, DAC and ICCAD. It asks one question. What do these papers, taken together, say about where chip and computer design is going?"}, {"src": "slides/02-three.jpg", "alt": "The whole story in three sentences.", "notes": "Here is the whole story in three sentences. One: chip design is becoming a loop. Propose, check, learn, try again. Two: accelerators, memory and reliability draw the most papers. Three: most papers were read from short descriptions, so these are hypotheses, not proven trends."}, {"src": "slides/03-path.jpg", "alt": "The atlas in five steps: papers, themes, subthemes, deep reads, what to watch.", "notes": "The atlas works in five steps. Start with 582 paper records. Sort them into 10 broad themes, then 113 narrower subthemes, each explained in plain words. Read some papers in full. Then ask which directions keep coming back, and what test would confirm them."}, {"src": "slides/04-confs.jpg", "alt": "DAC supplies 544 of the 582 papers.", "notes": "First, where the papers come from. DAC, the Design Automation Conference, supplies 544 of the 582. ISCA, the main computer architecture conference, adds 17 selected papers. ICCAD's 2026 papers were not public yet, so 21 come from 2025. So the atlas leans toward design software."}, {"src": "slides/05-themes.jpg", "alt": "Accelerators, memory and reliability are the three largest of 10 themes.", "notes": "Here is where the attention goes. Architecture and accelerators is the largest theme, with 103 papers. Memory, interconnect, and storage has 85. Power, reliability, and security has 78. A count shows where this sample spends its attention. It is not a ranking of importance."}, {"src": "slides/06-loop.jpg", "alt": "Direction: design becomes a loop that checks every candidate and learns from what failed.", "notes": "The common thread is a loop. A model or a search proposes a design. Tools check it: does it compile, does it simulate correctly, does it meet timing? The check reports what failed, and the next attempt uses that. The hard question is cost: a fair test counts every model call, retry and check."}, {"src": "slides/07-data.jpg", "alt": "Direction: moving data often costs more than computing it.", "notes": "The second direction is about data. A chip can have thousands of arithmetic units, but they wait if their inputs cannot arrive in time. So many papers decide where data sits, how far it moves, and whether to compute next to memory. The test is the end-to-end result, with every copy and wait counted."}, {"src": "slides/08-physical.jpg", "alt": "Directions: physical limits and faults enter the design early.", "notes": "Two more directions move physics and safety earlier. Heat, wire delay and power supply used to be checked at the end. Now fast estimates guide early choices, but the final design still needs an accurate check. Likewise, faults and attacks are named first, and the cost of protection is reported, not hidden."}, {"src": "slides/09-measure.jpg", "alt": "Direction: how results are measured is becoming research in its own right.", "notes": "The last direction is about measurement itself. A score means little without the tasks it was tested on, the rule for success, and the baseline. More papers now build benchmarks and release their tools. The test for this direction is simple: can someone else repeat the result and get the same answer?"}, {"src": "slides/10-depth.jpg", "alt": "Only 33 of 582 papers were read from a full paper or preprint.", "notes": "Now, how sure can we be? 541 of the 582 records were coded from the short official program description. Only 33 come from a full paper, preprint or author PDF. 16 papers were checked in depth. So every direction here is a hypothesis to test, not a proven trend."}, {"src": "slides/11-watch.jpg", "alt": "Six directions to watch, each with a test that could disprove it.", "notes": "Here are the six directions to watch. Requirements checked while designing. Data movement as the real cost. Measure, then decide the next design. Faults and attacks planned early. Physical limits in the loop. And better ways to measure. Each page names the paper that pushes back, and the result that would disprove it."}, {"src": "slides/12-start.jpg", "alt": "Where to start: themes, subthemes, deep reads and the six directions.", "notes": "To explore it yourself, start with a theme. Each one explains the technical problem in plain words, then links to its subthemes and every paper in them. Check the deep reads for papers read in full. Then open the six directions. Everything is linked from the big picture page."}];
(function(){
  var items = ITEMS, i = 0;
  var m = /#([0-9]+)$/.exec(location.hash); if (m) i = Math.min(items.length - 1, Math.max(0, +m[1] - 1));
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel('course-present') : null, quiet = false;
  function show(n){
    i = Math.min(items.length - 1, Math.max(0, n));
    document.getElementById('now').src = items[i].src; document.getElementById('now').alt = items[i].alt;
    var next = items[i + 1]; var nextImg = document.getElementById('next-img'); var end = document.getElementById('end');
    if (next) { nextImg.hidden = false; end.hidden = true; nextImg.src = next.src; nextImg.alt = 'Next: ' + next.alt; } else { nextImg.hidden = true; end.hidden = false; }
    document.getElementById('notes').textContent = items[i].notes || 'No notes for this slide.';
    document.getElementById('count').textContent = (i + 1) + ' / ' + items.length;
    history.replaceState(null, '', '#' + (i + 1));
    if (channel && !quiet) channel.postMessage({slide: i});
  }
  if (channel) { channel.onmessage = function(e){ if (e.data && typeof e.data.slide === 'number' && e.data.slide !== i) { quiet = true; show(e.data.slide); quiet = false; } }; channel.postMessage({hello: true}); }
  // A simple talk timer: starts with the first move, or with the Start button.
  var start = null, timer = null;
  function tick(){ var s = Math.floor((Date.now() - start) / 1000); document.getElementById('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function begin(){ if (start === null) { start = Date.now(); timer = setInterval(tick, 500); tick(); document.getElementById('timer').textContent = 'Reset timer'; } }
  document.getElementById('timer').onclick = function(){ if (start === null) begin(); else { clearInterval(timer); start = null; document.getElementById('clock').textContent = '00:00'; this.textContent = 'Start timer'; } };
  document.getElementById('prev').onclick = function(){ begin(); show(i - 1); };
  document.getElementById('next').onclick = function(){ begin(); show(i + 1); };
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return; var k = e.key;
    if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); begin(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); } else if (k === 'End') { e.preventDefault(); show(items.length - 1); }
  });
  show(i);
})();
</script>
</body></html>
